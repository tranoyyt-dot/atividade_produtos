<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pagina.css') }}">
</head>
<body>
    <main class="container">
        <h1>Cadastrar Produto</h1>

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form action="{{ url_for('produto_bp.cadastrar') }}" method="POST">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" maxlength="100" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>

            <label for="preco">Preço (R$) *</label>
            <input type="number" id="preco" name="preco" step="0.01" min="0" required>

            <label for="quantidade">Quantidade *</label>
            <input type="number" id="quantidade" name="quantidade" min="0" required>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" maxlength="50">

            <div class="acoes">
                <button type="submit" class="botao">Salvar</button>
                <a href="{{ url_for('produto_bp.listar') }}" class="botao secundario">Ver lista</a>
            </div>
        </form>
    </main>
</body>
</html>
